<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO: A meta description improves search engine visibility. -->
  <meta name="description" content="Contact form to get in touch with My Personal Website.">
  
  <title>Contact - My Personal Website</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header>
    <!-- The site logo should be a link to the homepage. -->
    <a href="index.html" class="logo">🚀 MySite</a>
    
    <nav>
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="blog.html">Blog</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    
    <!-- Interactive elements like a theme toggle should be <button>s for accessibility. -->
    <button type="button" class="theme-toggle" aria-label="Toggle dark and light theme">🌙</button>
  </header>

  <!-- The <main> element wraps the dominant content of the page. -->
  <main>
    <section>
      <h2>Contact Me</h2>
      
      <!-- 
        Accessibility & Best Practice: Forms should have an 'action' and 'method'.
        The 'action' attribute specifies where to send the form-data when a form is submitted.
        'method="POST"' is typically used for submitting data.
      -->
      <form action="/path-to-your-form-handler" method="POST">
        
        <!-- Accessibility: Each input should have a corresponding <label>. -->
        <!-- This links the text to the input field, which is crucial for screen readers. -->
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="e.g., Jane Doe" required>
        
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="e.g., jane.doe@example.com" required>
        
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message here..."></textarea>
        
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Your Name. All Rights Reserved.</p>
  </footer>

  <script src="assets/js/script.js"></script>
</body>
</html>
